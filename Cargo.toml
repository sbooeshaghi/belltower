[workspace]
members = [
    "crates/belltower",
    "crates/bt-core",
    "crates/bt-protocol",
    "crates/bt-client",
    "crates/bt-session",
    "crates/bt-runtime",
    "crates/bt-agent",
    "crates/bt-providers",
    "crates/bt-tools",
    "crates/bt-context",
    "crates/bt-auth",
    "crates/bt-mcp",
    "crates/bt-server",
    "crates/bt-tui",
    "crates/bt-models",
    "crates/bt-readiness",
    "crates/bt-otel",
    "crates/bt-improve",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sbooeshaghi/belltower"
homepage = "https://github.com/sbooeshaghi/belltower"

[workspace.dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.1", features = ["macros"] }
base64 = "0.22.1"
camino = { version = "1.1.9", features = ["serde1"] }
clap = { version = "4.5.38", features = ["derive"] }
crossterm = "0.28.1"
futures-core = "0.3.31"
futures-util = "0.3.31"
fs2 = "0.4.3"
ignore = "0.4.24"
keyring = "3.6.3"
nix = { version = "0.29.0", default-features = false, features = ["process", "signal"] }
opentelemetry-proto = { version = "0.28.0", default-features = false, features = ["trace", "gen-tonic-messages", "with-serde"] }
prost = "0.13"
rand = "0.9.0"
ratatui = "0.29.0"
regex = "1.12.2"
reqwest = { version = "0.12.15", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
rpassword = "7.4.0"
rusqlite = { version = "0.37.0", features = ["bundled", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.20.0"
temp-env = "0.3.6"
thiserror = "2.0.12"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1.46.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8.20"
tracing = "0.1.41"
unicode-width = "0.2.0"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
