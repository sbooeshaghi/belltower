name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release_version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Resolve version and verify release tag
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(cargo pkgid -p belltower | sed -E 's/.*[@#]//')"
          release_version="v${workspace_version}"
          echo "value=${release_version}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test "${GITHUB_REF_NAME}" = "${release_version}"
          fi

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Check bt-agent purity
        run: cargo test -p bt-agent --test purity --locked

      - name: Check crate boundaries
        run: bash scripts/check_crate_boundaries.sh

      - name: Check file-size limits
        run: make file-size

      - name: Check OpenAPI drift
        run: make openapi-check

      - name: Run foundation acceptance
        run: make acceptance

      - name: Check source/archive distribution contract
        run: bash scripts/distribution.sh --preflight

      - name: Check local install path
        run: bash scripts/distribution.sh --install-check

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            exe_suffix: ""
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            exe_suffix: ""
            use_cross: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            exe_suffix: ""
            use_cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            exe_suffix: ""
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            exe_suffix: ".exe"
            use_cross: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Test Windows shell execution and process-tree teardown
        if: runner.os == 'Windows'
        run: cargo test -p bt-tools shell::tests --locked

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cargo install cross --locked
            cross build --release --locked --target "${{ matrix.target }}" -p belltower -p bt-server -p bt-tui --bins
          else
            rustup target add "${{ matrix.target }}"
            cargo build --release --locked --target "${{ matrix.target }}" -p belltower -p bt-server -p bt-tui --bins
          fi

      - name: Verify binary starts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.use_cross }}" != "true" ]]; then
            "target/${{ matrix.target }}/release/belltower${{ matrix.exe_suffix }}" --version
            doctor_output="$("target/${{ matrix.target }}/release/belltower${{ matrix.exe_suffix }}" doctor)"
            grep -Fq "[ok] server binary:" <<<"${doctor_output}"
            grep -Fq "[ok] tui binary:" <<<"${doctor_output}"
          fi
          test -f "target/${{ matrix.target }}/release/bt-server${{ matrix.exe_suffix }}"
          test -f "target/${{ matrix.target }}/release/bt-tui${{ matrix.exe_suffix }}"

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.release_version }}"
          target="${{ matrix.target }}"
          name="belltower-${version}-${target}"
          mkdir -p "dist/${name}"
          cp "target/${target}/release/belltower" "dist/${name}/belltower"
          cp "target/${target}/release/bt-server" "dist/${name}/bt-server"
          cp "target/${target}/release/bt-tui" "dist/${name}/bt-tui"
          cp LICENSE "dist/${name}/LICENSE"
          cat > "dist/${name}/README.txt" <<EOF
          Belltower ${version} (${target})

          Run:
            ./belltower --version
            ./belltower doctor

          Install guide: https://github.com/sbooeshaghi/belltower/blob/main/docs/install.md
          EOF
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.verify.outputs.release_version }}"
          $target = "${{ matrix.target }}"
          $name = "belltower-$version-$target"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/$target/release/belltower.exe" "$dir/belltower.exe"
          Copy-Item "target/$target/release/bt-server.exe" "$dir/bt-server.exe"
          Copy-Item "target/$target/release/bt-tui.exe" "$dir/bt-tui.exe"
          Copy-Item "LICENSE" "$dir/LICENSE"
          Set-Content -Path "$dir/README.txt" -Value @"
          Belltower $version ($target)

          Run:
            .\belltower.exe --version
            .\belltower.exe doctor

          Install guide: https://github.com/sbooeshaghi/belltower/blob/main/docs/install.md
          "@
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/$name.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: belltower-${{ needs.verify.outputs.release_version }}-${{ matrix.target }}
          path: dist/belltower-*-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish complete release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download every platform artifact
        uses: actions/download-artifact@v4
        with:
          pattern: belltower-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Verify complete artifact set and write checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')" = "5"
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS

      - name: Upload complete GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
