name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Check bt-agent purity
        run: cargo test -p bt-agent --test purity

      - name: Check crate boundaries
        run: bash scripts/check_crate_boundaries.sh

      - name: Check file-size limits
        run: make file-size

      - name: Check OpenAPI drift
        run: make openapi-check

      - name: Run foundation acceptance
        run: make acceptance

      - name: Check publishable packages
        run: bash scripts/publish.sh --preflight

      - name: Check local install path
        run: bash scripts/publish.sh --install-check

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            exe_suffix: ""
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            exe_suffix: ""
            use_cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
            exe_suffix: ""
            use_cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            exe_suffix: ""
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            exe_suffix: ".exe"
            use_cross: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cargo install cross --locked
            cross build --release --target "${{ matrix.target }}" -p belltower -p bt-server -p bt-tui --bins
          else
            rustup target add "${{ matrix.target }}"
            cargo build --release --target "${{ matrix.target }}" -p belltower -p bt-server -p bt-tui --bins
          fi

      - name: Verify binary starts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.use_cross }}" != "true" ]]; then
            "target/${{ matrix.target }}/release/belltower${{ matrix.exe_suffix }}" --version
          fi
          test -f "target/${{ matrix.target }}/release/bt-server${{ matrix.exe_suffix }}"
          test -f "target/${{ matrix.target }}/release/bt-tui${{ matrix.exe_suffix }}"

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          name="belltower-${version}-${target}"
          mkdir -p "dist/${name}"
          cp "target/${target}/release/belltower" "dist/${name}/belltower"
          cp "target/${target}/release/bt-server" "dist/${name}/bt-server"
          cp "target/${target}/release/bt-tui" "dist/${name}/bt-tui"
          cat > "dist/${name}/README.txt" <<EOF
          Belltower ${version} (${target})

          Run:
            ./belltower --version
            ./belltower doctor

          Docs: https://github.com/TheBiologyCompany/belltower
          EOF
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}"
          $target = "${{ matrix.target }}"
          $name = "belltower-$version-$target"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/$target/release/belltower.exe" "$dir/belltower.exe"
          Copy-Item "target/$target/release/bt-server.exe" "$dir/bt-server.exe"
          Copy-Item "target/$target/release/bt-tui.exe" "$dir/bt-tui.exe"
          Set-Content -Path "$dir/README.txt" -Value @"
          Belltower $version ($target)

          Run:
            .\belltower.exe --version
            .\belltower.exe doctor

          Docs: https://github.com/TheBiologyCompany/belltower
          "@
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/$name.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: belltower-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/belltower-*-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload GitHub release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/belltower-*-${{ matrix.target }}.${{ matrix.archive }}
