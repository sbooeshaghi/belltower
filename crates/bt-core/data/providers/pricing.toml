version = 1

# OpenAI API standard short-context rates.
# Source: https://developers.openai.com/api/docs/pricing
[[pricing]]
provider = "openai-compatible"
model_pattern = "gpt-5.4"
prompt_usd_per_million = 2.50
completion_usd_per_million = 15.00
cache_read_usd_per_million = 0.25
reasoning_usd_per_million = 15.00

[[pricing]]
provider = "openai-compatible"
model_pattern = "gpt-5.4-mini"
prompt_usd_per_million = 0.75
completion_usd_per_million = 4.50
cache_read_usd_per_million = 0.075
reasoning_usd_per_million = 4.50

[[pricing]]
provider = "openai-compatible"
model_pattern = "gpt-5.3-codex"
prompt_usd_per_million = 1.75
completion_usd_per_million = 14.00
cache_read_usd_per_million = 0.175
reasoning_usd_per_million = 14.00

# Explicit row avoids falling through the shorter gpt-5.3-codex prefix
# when the Spark model is configured.
[[pricing]]
