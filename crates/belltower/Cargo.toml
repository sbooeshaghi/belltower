[package]
name = "belltower"
description = "Belltower command-line launcher for the multi-provider agent harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "belltower"
path = "src/main.rs"

[dependencies]
bt-auth = { version = "0.1.0", path = "../bt-auth" }
bt-client = { version = "0.1.0", path = "../bt-client" }
bt-core = { version = "0.1.0", path = "../bt-core" }
bt-models = { version = "0.1.0", path = "../bt-models" }
bt-protocol = { version = "0.1.0", path = "../bt-protocol" }
bt-providers = { version = "0.1.0", path = "../bt-providers" }
bt-readiness = { version = "0.1.0", path = "../bt-readiness" }
bt-session = { version = "0.1.0", path = "../bt-session" }
clap.workspace = true
reqwest.workspace = true
rpassword.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
